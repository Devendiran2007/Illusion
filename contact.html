<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcmeCorp Support</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <a href="account.html" class="logo">AcmeCorp</a>
            <div class="nav-links">
                <a href="contact.html" class="nav-link">Shop</a>
                <a href="index.html" class="nav-link">Account</a>
                <a href="products.html" class="nav-link">Support</a>
                <a href="login.html" class="nav-link" style="background: rgba(255,255,255,0.05); padding: 0.5rem 1rem; border-radius: 8px;">
                    🛒 <span class="wishlist-counter" style="font-weight: 600;">0</span>
                </a>
            </div>
        </nav>

        <main class="main-content">
            <div style="max-width: 600px; margin: 2rem auto; position: relative;">
                <div class="card" style="display: flex; flex-direction: column-reverse;">
                    
                    <form onsubmit="event.preventDefault(); addToCart({ id: 999, name: 'Random Item', price: 99 }); alert('Thank you! A random item was added to your cart.');" style="display: flex; flex-direction: column-reverse;">
                        
                        <div style="margin-top: 2rem;">
                            <button type="submit" class="btn btn-primary chasing-button" style="width: 100%;">
                                Send Message
                            </button>
                        </div>

                        <div class="form-group" style="display: flex; flex-direction: column-reverse;">
                            <textarea class="phantom-input form-input" rows="5" required></textarea>
                            <label class="form-label low-contrast-text" style="margin-bottom: 0; margin-top: 0.5rem;">Message</label>
                        </div>

                        <div class="form-group" style="display: flex; flex-direction: column-reverse;">
                            <input type="email" class="phantom-input form-input" required>
                            <label class="form-label low-contrast-text" style="font-size: 0.75rem; margin-bottom: 0; margin-top: 0.5rem;">Email Address *</label>
                        </div>
                        
                        <div class="form-group" style="display: flex; flex-direction: column-reverse;">
                            <input type="text" class="phantom-input form-input" required>
                            <label class="form-label low-contrast-text" style="font-size: 0.75rem; margin-bottom: 0; margin-top: 0.5rem;">Full Name *</label>
                        </div>

                    </form>

                    <h1 style="margin-top: 2rem; margin-bottom: 0;">Support</h1>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-links">
                <a href="contact.html" class="footer-link">Privacy Policy</a>
                <a href="login.html" class="footer-link">Terms of Service</a>
                <a href="checkout.html" class="footer-link">Settings</a>
                <a href="index.html" class="footer-link">Help Center</a>
            </div>
            <p style="color: var(--text-muted); font-size: 0.85rem;">
                &copy; 2026 Acme Corp. Premium SaaS. All rights reserved.
            </p>
        </footer>
    </div>
</body>
</html>
