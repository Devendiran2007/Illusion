<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcmeCorp Checkout</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <a href="account.html" class="logo">AcmeCorp</a>
            <div class="nav-links">
                <a href="contact.html" class="nav-link">Shop</a>
                <a href="index.html" class="nav-link">Account</a>
                <a href="products.html" class="nav-link">Support</a>
                <a href="login.html" class="nav-link" style="background: rgba(255,255,255,0.05); padding: 0.5rem 1rem; border-radius: 8px;">
                    🛒 <span class="wishlist-counter" style="font-weight: 600;">0</span>
                </a>
            </div>
        </nav>

        <main class="main-content">
            <div style="display: flex; gap: 3rem; flex-wrap: wrap;">
                <div style="flex: 1 1 600px;">
                    <h1 style="margin-bottom: 2rem;">Checkout</h1>
                    
                    <div class="card" style="margin-bottom: 2rem;">
                        <h2 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Shipping Address</h2>
                        <div class="form-group">
                            <label class="form-label low-contrast-text">Address Line 1</label>
                            <input type="text" class="phantom-input form-input">
                        </div>
                        
                        <div style="display: flex; gap: 1rem;">
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label low-contrast-text">City</label>
                                <input type="text" class="phantom-input form-input">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label low-contrast-text">ZIP Code</label>
                                <input type="text" class="phantom-input form-input">
                            </div>
                        </div>
                    </div>
                </div>

                <div style="flex: 1 1 400px;">
                    <div class="card" style="position: sticky; top: 2rem;">
                        <h2 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Order Summary</h2>
                        
                        <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
                            <p class="low-contrast-text">Cart is empty.</p>
                        </div>

                        <div style="border-top: 1px solid var(--border-color); padding-top: 1rem; margin-bottom: 2rem;">
                            <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.25rem;">
                                <span>Total</span>
                                <span>$0</span>
                            </div>
                        </div>

                        <!-- Scrambled button action -->
                        <button class="btn btn-primary chasing-button" style="width: 100%; padding: 1rem; font-size: 1.1rem;" onclick="window.location.href='account.html'">
                            Complete Purchase
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-links">
                <a href="contact.html" class="footer-link">Privacy Policy</a>
                <a href="login.html" class="footer-link">Terms of Service</a>
                <a href="checkout.html" class="footer-link">Settings</a>
                <a href="index.html" class="footer-link">Help Center</a>
            </div>
            <p style="color: var(--text-muted); font-size: 0.85rem;">
                &copy; 2026 Acme Corp. Premium SaaS. All rights reserved.
            </p>
        </footer>
    </div>
</body>
</html>
