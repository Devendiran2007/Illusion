<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AcmeCorp Account</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <style>
        /* Make the entire page flow from top to bottom */
        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
        }

        .footer {
            margin-top: auto;
            position: static;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- Navbar -->
        <nav class="navbar">

            <a href="index.html" class="logo">
                AcmeCorp
            </a>

            <div class="nav-links">

                <a href="products.html" class="nav-link">
                    Shop
                </a>

                <a href="account.html" class="nav-link">
                    Account
                </a>

                <a href="contact.html" class="nav-link">
                    Support
                </a>

                <a
                    href="checkout.html"
                    class="nav-link"
                    style="
                        background: rgba(255,255,255,0.05);
                        padding: 0.5rem 1rem;
                        border-radius: 8px;
                    "
                >
                    🛒
                    <span
                        class="wishlist-counter"
                        style="font-weight: 600;"
                    >
                        0
                    </span>
                </a>

            </div>

        </nav>


        <!-- Main Content -->
        <main class="main-content">

            <div
                style="
                    display: flex;
                    gap: 3rem;
                    flex-wrap: wrap;
                "
            >

                <!-- Account Section -->
                <section style="flex: 1 1 500px;">

                    <h1 style="margin-bottom: 2rem;">
                        Account Settings
                    </h1>


                    <!-- Preferences -->
                    <div
                        class="card"
                        style="margin-bottom: 2rem;"
                    >

                        <h2
                            style="
                                font-size: 1.25rem;
                                margin-bottom: 1.5rem;
                            "
                        >
                            Preferences
                        </h2>


                        <div
                            style="
                                display: flex;
                                align-items: center;
                                justify-content: space-between;
                                padding: 1rem;
                                background: rgba(255,255,255,0.02);
                                border-radius: 8px;
                                margin-bottom: 1rem;
                            "
                        >

                            <div>

                                <strong>
                                    Email Notifications
                                </strong>

                                <p
                                    class="low-contrast-text"
                                    style="font-size: 0.85rem;"
                                >
                                    Receive updates and marketing.
                                </p>

                            </div>


                            <label
                                style="
                                    display: flex;
                                    align-items: center;
                                    cursor: pointer;
                                "
                            >

                                <input
                                    type="checkbox"
                                    checked
                                    style="
                                        width: 20px;
                                        height: 20px;
                                    "
                                >

                            </label>

                        </div>


                        <button
                            type="button"
                            class="btn btn-primary"
                            onclick="saveChanges()"
                        >
                            Save Changes
                        </button>

                    </div>


                    <!-- Billing -->
                    <div class="card">

                        <h2
                            style="
                                font-size: 1.25rem;
                                margin-bottom: 1.5rem;
                            "
                        >
                            Billing History
                        </h2>


                        <div
                            style="
                                background: rgba(255,255,255,0.03);
                                padding: 1.5rem;
                                border-radius: 12px;
                            "
                        >

                            <p
                                class="low-contrast-text"
                                style="font-size: 0.9rem;"
                            >
                                Invoice #884422
                            </p>


                            <div
                                style="
                                    display: flex;
                                    justify-content: space-between;
                                    align-items: center;
                                    margin-top: 1rem;
                                    gap: 1rem;
                                    flex-wrap: wrap;
                                "
                            >

                                <span style="font-size: 0.9rem;">
                                    Next charge on Nov 1, 2026
                                </span>


                                <button
                                    type="button"
                                    class="fake-button"
                                    onclick="cancelSubscription()"
                                >
                                    Cancel Subscription
                                </button>

                            </div>

                        </div>

                    </div>

                </section>


                <!-- Sidebar -->
                <aside style="flex: 0 0 250px;">

                    <div
                        style="
                            display: flex;
                            flex-direction: column;
                            gap: 0.5rem;
                        "
                    >

                        <button
                            type="button"
                            class="btn btn-primary"
                            style="justify-content: flex-start;"
                            onclick="scrollToBilling()"
                        >
                            Billing
                        </button>


                        <button
                            type="button"
                            class="btn btn-secondary"
                            style="justify-content: flex-start;"
                            onclick="showProfile()"
                        >
                            Profile
                        </button>

                    </div>

                </aside>

            </div>

        </main>


        <!-- Footer -->
        <footer class="footer">

            <div class="footer-links">

                <a
                    href="contact.html"
                    class="footer-link"
                >
                    Privacy Policy
                </a>

                <a
                    href="login.html"
                    class="footer-link"
                >
                    Terms of Service
                </a>

                <a
                    href="account.html"
                    class="footer-link"
                >
                    Settings
                </a>

                <a
                    href="index.html"
                    class="footer-link"
                >
                    Help Center
                </a>

            </div>


            <p
                style="
                    color: var(--text-muted);
                    font-size: 0.85rem;
                "
            >
                &copy; 2026 Acme Corp. Premium SaaS.
                All rights reserved.
            </p>

        </footer>

    </div>


    <!-- Page JavaScript -->
    <script>

        function saveChanges() {
            alert("Your changes have been saved.");
        }


        function cancelSubscription() {

            const confirmed = confirm(
                "Are you sure you want to cancel your subscription?"
            );

            if (confirmed) {
                alert(
                    "Your subscription cancellation request has been submitted."
                );
            }

        }


        function scrollToBilling() {

            const billingSection =
                document.querySelector(".card:last-child");

            billingSection.scrollIntoView({
                behavior: "smooth"
            });

        }


        function showProfile() {

            alert(
                "Profile settings will be available here."
            );

        }

    </script>

</body>
</html>
